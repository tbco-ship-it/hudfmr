<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="{{ origin }}{{ base }}widget/">
<title>Fair Market Rent lookup | {{ site }}</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--text:#191f28;--muted:#6b7684;--line:#e5e8eb;--accent:#3182f6}
@media (prefers-color-scheme:dark){:root{--bg:#17171c;--text:#f2f4f6;--muted:#9ea7b3;--line:#2c2c35;--accent:#4c9aff}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.w{padding:14px 16px;border:1px solid var(--line);border-radius:14px;max-width:420px}
h1{font-size:16px;margin:0 0 10px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
select,input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.out{margin-top:12px;min-height:48px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}.num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.sub{font-size:13px;color:var(--muted)}
.by{margin-top:10px;font-size:12px;color:var(--muted)}a{color:var(--accent)}
</style>
</head>
<body>
<div class="w">
  <h1>Fair Market Rent lookup</h1>
  <label for="zip">ZIP code</label><input id="zip" inputmode="numeric" maxlength="5" placeholder="e.g. 78701" autocomplete="postal-code">
  <div class="out" id="out" aria-live="polite"></div>
  <p class="by">HUD {{ fy }} Small Area FMR, gross rent incl. utilities. Income needed = rent at 30% of income. Data: <a id="by" href="{{ origin }}{{ base }}" target="_blank" rel="noopener">FMR Finder</a></p>
</div>
<script src="{{ base }}static/embed.js?v={{ v }}" defer></script>
</body>
</html>
